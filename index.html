<title>미니도희 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script>
// CSV 해석기 (외부 라이브러리 없이 동작) — 따옴표 안의 쉼표·줄바꿈, "" 이스케이프 처리
window.Papa = { parse(text){
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ","){ row.push(f); f = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && text[i+1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f !== "" || row.length){ row.push(f); rows.push(row); }
  return { data: rows };
}};
</script>

<script>
/* ==================================================================
   ✏️ 설정 — 이 부분만 고치면 됩니다
   ------------------------------------------------------------------
   · pages 의 첫 번째 = 메인(광고 스케줄). 나머지 = 카테고리 탭
   · file    : 저장소 안 CSV 경로 (구글시트 → 파일 → 다운로드 → CSV)
   · 달력 모양 시트("10월 스케줄" 형태)는 자동으로 달력으로 인식합니다
   · layer   : 달력 시트를 메인 달력에 어떤 이름/색(1~3)으로 겹칠지
   · dateLayer : 표 시트의 날짜 열을 메인 달력에 같이 띄우기
   · filters : 표 위에 드롭다운 필터로 만들 열 이름

.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.panel-note{color:var(--muted);font-size:12px;margin-top:6px}
.timeline{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.timeline li{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.timeline .mo{font-weight:700}
.timeline .tx{margin-top:4px;word-break:keep-all}
.barlist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.bl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;margin-bottom:5px}
.bl-k{font-weight:500;overflow-wrap:anywhere}
.bl-v{white-space:nowrap;font-variant-numeric:tabular-nums}
.bl-track{height:8px;border-radius:4px;background:var(--panel-2)}
.bl-bar{height:100%;border-radius:4px;min-width:4px}
.rev-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-bottom:16px;align-items:start}
@media (max-width:980px){.rev-grid{grid-template-columns:minmax(0,1fr)}}
.rev-grid > *,.side-stack > *{min-width:0}
.chart{min-width:0;overflow:hidden}
.side-stack{display:flex;flex-direction:column;gap:16px}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0;background:var(--panel)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap;color:var(--text-2)}
.st i{width:8px;height:8px;border-radius:50%;display:inline-block}
.react-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:12px}
</style>

<script>
/* ======================= 유틸 ======================= */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").replace(/\s+/g, "");
const DOW = ["일","월","화","수","목","금","토"];
const today = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();
const sameDay = (a,b) => a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
const dayDiff = d => Math.round((d - today) / 86400000);
const fmtDate = d => `${d.getMonth()+1}/${d.getDate()} (${DOW[d.getDay()]})`;
const ddLabel = d => { const n = dayDiff(d); return n === 0 ? "오늘" : n > 0 ? `D-${n}` : `D+${-n}`; };

// 숫자: "1,234" / "3.1만" / "1.2천" / "2억" / "₩50,000"
function num(v){
  const s = String(v ?? "").replace(/[,₩원배\s]/g, "");
  const m = s.match(/^(-?\d+(?:\.\d+)?)(백|천|만|억)?$/);
  if (!m) return null;
  return parseFloat(m[1]) * ({백:1e2, 천:1e3, 만:1e4, 억:1e8}[m[2]] || 1);
}
const compact = n => n >= 1e8 ? (n/1e8).toFixed(1).replace(/\.0$/,"")+"억"
                   : n >= 1e4 ? (n/1e4).toFixed(1).replace(/\.0$/,"")+"만"
                   : Math.round(n).toLocaleString("ko-KR");

let BUNDLE = null;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptBundle(pw){
  const enc = ENCRYPTED_DATA;
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(enc.salt), iterations:enc.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(enc.iv)}, key, b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
// 구글 시트 '웹에 게시(CSV)' 주소가 설정돼 있으면 열 때마다 최신 내용을 불러옴 (실패하면 파일에 넣어 둔 데이터 사용)
let LIVE = null;
async function loadLive(){
  const live = BUNDLE && BUNDLE.live;
  if (!live || !Object.keys(live).length) return;
  LIVE = {ok:[], fail:[], at:new Date()};
  await Promise.all(Object.entries(live).map(async ([name, url]) => {
    try {
      if (!/^https:\/\/docs\.google\.com\/spreadsheets\//.test(url)) throw new Error("bad url");
      const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 15000);
      const res = await fetch(url, {cache:"no-store", signal:ctl.signal});
      clearTimeout(timer);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      if (/^\s*</.test(text)) throw new Error("CSV가 아님");     // 게시 해제·로그인 화면 등
      BUNDLE.files[name] = text; LIVE.ok.push(name);
    } catch(e){ LIVE.fail.push(name); }
  }));
}
async function fetchRows(file){
  const name = file.split("/").pop();
  const text = BUNDLE.files[name];
  if (text === undefined) throw new Error(`${name} 데이터가 data.enc 안에 없습니다`);
  const rows = Papa.parse(text.replace(/^\uFEFF/, ""), {skipEmptyLines:false}).data.map(r => r.map(c => String(c ?? "").trim()));
  return {rows, modified: LIVE && LIVE.ok.includes(name) ? LIVE.at.toISOString() : BUNDLE.updated};
}

// 달력형 시트("10월 스케줄" + 날짜칸 + 바로 아래 일정칸)
// 광고 스케줄 시트 위쪽의 '광고 단가' 표 (플랫폼 · 팔로워 · 합계 · 항목별 단가)
function parseRateCard(rows){
  const h = rows.findIndex(r => r.some(c => /^플랫폼$/.test(c.trim())) && r.some(c => /단가|합계/.test(c)));
  if (h < 0) return null;
  const H = rows[h].map(c => c.replace(/\s+/g, " ").trim());
  const ci = re => H.findIndex(c => re.test(c));
  const plat = ci(/^플랫폼$/), who = ci(/크리에이터/), fol = ci(/팔로워|구독자/), avg = ci(/평균\s*조회/), link = ci(/^링크$/);
  const first = H.findIndex(c => /합계|단가|브랜디드|PPL/i.test(c));
  const priceCols = H.map((c,i) => i).filter(i => i >= first && H[i]);
  const notes = {}, items = [];
  let end = h, lastWho = "";
  for (let r = h + 1; r < rows.length; r++){
    const row = rows[r] || [];
    if (!row.some(c => c && c.trim())) { if (items.length) break; end = r; continue; }
    if (row.some(c => /^\d{1,2}월\s*스케줄$/.test(c.trim()))) break;
    const money = priceCols.some(i => /[₩\d]/.test(row[i] || ""));
    if (!(row[plat] || "").trim() && !money){   // 항목 설명 줄 (예: 클린본(x) 컷편집·자막수정)
      if (items.length) break;
      priceCols.forEach(i => { if ((row[i] || "").trim()) notes[i] = row[i].replace(/\s*\n\s*/g, " ").trim(); });
      end = r; continue;
    }
    if ((row[who] || "").trim()) lastWho = row[who].trim();
    items.push({
      who: lastWho, platform: (row[plat] || "").trim(), followers: fol >= 0 ? (row[fol] || "").trim() : "",
      avg: avg >= 0 ? (row[avg] || "").trim() : "", link: link >= 0 ? (row[link] || "").trim() : "",
      prices: priceCols.filter(i => (row[i] || "").trim()).map(i => ({label: H[i].replace(/\s*\(VAT\s*별도\)\s*/, ""), value: row[i].trim(), note: notes[i] || "", total: /합계/.test(H[i])}))
    });
    end = r;
  }
  if (!items.length) return null;
  return {from: h, to: end, folLabel: fol >= 0 ? H[fol] : "", items};
}

function parseCalendar(rows){
  const rate = parseRateCard(rows);
  let firstMonth = null;
  const dateAt = new Set(), skip = new Set(), events = [], notes = [], warns = [];
  rows.forEach((r,ri) => r.forEach((c,ci) => {
    const mh = c.match(/^(\d{1,2})월\s*스케줄$/);
    if (mh){ skip.add(ri+","+ci); if (firstMonth === null) firstMonth = +mh[1]; }
    if (/^\d{1,2}\/\d{1,2}$/.test(c)) dateAt.add(ri+","+ci);
  }));
  const dateRows = new Set([...dateAt].map(k => +k.split(",")[0]));
  const headRows = new Set([...skip].map(k => +k.split(",")[0]));
  const yearOf = m => CONFIG.startYear + (firstMonth && m < firstMonth ? 1 : 0);
  rows.forEach((r,ri) => r.forEach((c,ci) => {
    if (!dateAt.has(ri+","+ci)) return;
    const [m,d] = c.split("/").map(Number);
    // 날짜 칸 아래로, 다음 주 날짜줄이 나오기 전까지(최대 3줄) 일정으로 읽기
    for (let k = 1; k <= 3; k++){
      const rr = ri + k;
      if (rr >= rows.length || dateRows.has(rr) || headRows.has(rr)) break;
      skip.add(rr+","+ci);
      const below = (rows[rr] || [])[ci] || "";
      below.split(/\n+/).map(s => s.trim()).filter(Boolean).forEach(text => {
        // "10/28~11/1" 처럼 기간이 적혀 있으면 기간 내 모든 날짜에 표시
        const rg = text.match(/(\d{1,2})\/(\d{1,2})\s*[~\-–]\s*(?:(\d{1,2})\/)?(\d{1,2})/);
        const cellDate = new Date(yearOf(m), m-1, d);
        if (rg){
          const sm = +rg[1], sd = +rg[2], em = rg[3] ? +rg[3] : sm, ed = +rg[4];
          // 칸 날짜와 가장 가까운 연도로 기간을 맞춤
          const cands = [-1, 0, 1].map(dy => new Date(cellDate.getFullYear() + dy, sm-1, sd));
          const start = cands.reduce((a,b) => Math.abs(b - cellDate) < Math.abs(a - cellDate) ? b : a);
          let end = new Date(start.getFullYear() + (em < sm ? 1 : 0), em-1, ed);
          const days = Math.round((end - start) / 86400000);
          const gap = Math.abs(start - cellDate) / 86400000;
          if (days >= 0 && days <= 31 && gap > 14)
            warns.push(`${m}/${d} 칸의 "${text}"은 적힌 기간과 칸 날짜가 달라서 ${m}/${d}에만 표시했어요. 시트에서 날짜를 확인해 주세요.`);
          if (days >= 0 && days <= 31 && gap <= 14){
            for (let t = 0; t <= days; t++){ const dt = new Date(start); dt.setDate(start.getDate() + t);
              events.push({date: dt, text, range: true, day: t + 1, days: days + 1}); }
            return;
          }
        }
        events.push({date: cellDate, text});
      });
    }
  }));
  // 달력보다 왼쪽 칸(줄 이름 "콘텐츠"/"광고", 행 번호 등)은 비고로 읽지 않음
  const minDateCol = Math.min(...[...dateAt].map(k => +k.split(",")[1]));
  rows.forEach((r,ri) => r.forEach((c,ci) => {
    const k = ri+","+ci;
    if (!c || ci < minDateCol || skip.has(k) || dateAt.has(k) || DOW.includes(c) || c === "메모장") return;
    if (rate && ri >= rate.from && ri <= rate.to) return;   // 광고 단가 표는 비고로 읽지 않음
    const t = c.replace(/^\s*\[비고\]\s*/, "").trim();
    if (t) notes.push(t);
  }));
  // 기간 일정과 같은 날·같은 이름으로 따로 적힌 일정은 하나로 합침
  const norm2 = t => t.replace(/\s+/g, "");
  const dedup = events.filter(e => e.range || !events.some(x => x.range && x.date.getTime() === e.date.getTime() && norm2(x.text).startsWith(norm2(e.text))));
  return {kind:"calendar", events: dedup, notes, warns, rate};
}

// 표형 시트 — 제목줄/빈 열/빈 행 자동 정리
function parseTable(rows){
  const filled = r => r.filter(c => c !== "").length;
  let hi = rows.findIndex((r,i) => filled(r) >= 3 && rows[i+1] && filled(rows[i+1]) >= 2);
  if (hi < 0){ let best = -1; rows.slice(0, 20).forEach((r,i) => { if (filled(r) >= 3 && filled(r) > best){ best = filled(r); hi = i; } }); if (hi < 0) hi = 0; }
  let title = "";
  for (let i = 0; i < hi && !title; i++) title = rows[i].find(c => c) || "";
  const head = rows[hi] || [];
  const body = rows.slice(hi+1);
  const width = Math.max(head.length, ...body.map(r => r.length));
  const cols = [];
  for (let ci = 0; ci < width; ci++){
    const vals = body.map(r => r[ci] || "").filter(Boolean);
    let h = head[ci] || "";
    if (!h && !vals.length) continue;                 // 완전히 빈 열은 제거
    if (!h) h = vals.every(v => /^\d+$/.test(v)) ? "No." : "구분";
    cols.push({ci, h});
  }
  // 같은 이름 열 구분
  const seen = {};
  cols.forEach(c => { seen[c.h] = (seen[c.h]||0) + 1; if (seen[c.h] > 1) c.h += " " + seen[c.h]; });
  // 번호/체크박스/"바로가기"만 있는 빈 행 제거
  const filler = /^(TRUE|FALSE|바로가기|\d+)$/i;
  const data = body
    .map(r => cols.map(c => r[c.ci] || ""))
    .filter(r => r.some(v => v && !filler.test(v)));
  return {kind:"table", title, headers: cols.map(c => c.h), data};
}

// 월별 지표 시트 — 헤더에 "1월"~"12월", 병합 셀(크리에이터)은 아래로 채움, "-"·빈칸은 값 없음(0 아님)
function parseMetrics(rows){
  const isMonth = c => /^\d{1,2}월$/.test(c);
  const hi = rows.findIndex(r => r.filter(isMonth).length >= 6);
  const head = rows[hi];
  const mcols = head.map((c,i) => isMonth(c) ? {i, m: parseInt(c)} : null).filter(Boolean);
  let li = head.findIndex(c => c === "구분"); if (li < 0) li = mcols[0].i - 2;
  const ei = head.findIndex(c => c);                       // 첫 헤더 = 크리에이터 열
  let title = ""; for (let k = 0; k < hi && !title; k++) title = rows[k].find(c => c) || "";
  let entity = "";
  const out = [];
  rows.slice(hi + 1).forEach(r => {
    if (ei !== li && r[ei]) entity = r[ei];                // 병합 셀 채우기
    const label = r[li];
    const raw = mcols.map(({i}) => r[i] || "");
    if (!label){
      const prev = out[out.length - 1];
      if (prev && prev.text && raw.some(v => v)) prev.raw = prev.raw.map((v,k) => [v, raw[k]].filter(Boolean).join(" "));
      return;
    }
    const values = raw.map(v => (v === "" || v === "-") ? null : num(v));
    const text = values.every(v => v === null) && raw.some(v => v && v !== "-");
    out.push({entity, label, raw, values, text});
  });
  return {kind:"metrics", title, entityHeader: ei !== li ? head[ei] : "", months: mcols.map(x => x.m), rows: out};
}

const fmtN = v => Math.round(v).toLocaleString("ko-KR");
const signed = v => (v > 0 ? "+" : v < 0 ? "−" : "±") + fmtN(Math.abs(v));
function channelSummary(d){
  const C = CONFIG.channel || {};
  const R = k => C[k] ? d.rows.find(r => norm(r.label) === norm(C[k])) || null : null;
  const M = i => d.months[i] + "월";
  const lastIdx = arr => { for (let k = arr.length - 1; k >= 0; k--) if (arr[k] !== null) return k; return null; };
  const prevIdx = (arr, k) => { for (let j = k - 1; j >= 0; j--) if (arr[j] !== null) return j; return null; };
  const stock = r => { if (!r) return null; const k = lastIdx(r.values); if (k === null) return null;
    const j = prevIdx(r.values, k); return {v: r.values[k], m: M(k), dv: j !== null ? r.values[k] - r.values[j] : null, pm: j !== null ? M(j) : null}; };
  const rows = {subs:R("ytSubs"), lg:R("ytLong"), sh:R("ytShort"), igf:R("igFollowers"), igv:R("igViews"), rc:R("reactions"), tg:R("target")};
  const out = {rows, M, subs: stock(rows.subs), igf: stock(rows.igf), igv: stock(rows.igv)};
  if (rows.lg || rows.sh){
    const tot = d.months.map((_,i) => { const a = rows.lg?.values[i] ?? null, b = rows.sh?.values[i] ?? null; return a === null && b === null ? null : (a || 0) + (b || 0); });
    const k = lastIdx(tot);
    if (k !== null){ const j = prevIdx(tot, k);
      out.yt = {v: tot[k], m: M(k), long: rows.lg?.values[k] ?? null, short: rows.sh?.values[k] ?? null,
                pct: j !== null && tot[j] ? (tot[k] - tot[j]) / tot[j] * 100 : null, pm: j !== null ? M(j) : null}; }
    const sum = r => r ? r.values.reduce((a,v) => a + (v || 0), 0) : 0;
    const filled = tot.map((v,i) => v !== null ? i : -1).filter(i => i >= 0);
    out.ytTotal = {v: sum(rows.lg) + sum(rows.sh), long: sum(rows.lg), short: sum(rows.sh),
                   range: filled.length ? `${M(filled[0])}~${M(filled[filled.length-1])}` : ""};
  }
  return out;
}

// 간단한 SVG 차트 (꺾은선 / 묶은 막대) — 마우스·터치 툴팁 포함
const niceStep = (range, n) => { const raw = range / n || 1, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; };
function mountChart(host, spec){
  let lastW = 0;
  const draw = () => {
    const W = Math.max(280, host.clientWidth); lastW = host.clientWidth;
    const H = spec.h || 230, M = {t:22, r:14, b:26, l:50};
    const n = spec.labels.length, pw = W - M.l - M.r, ph = H - M.t - M.b, bw = pw / n;
    const all = spec.series.flatMap(s => s.values).filter(v => v !== null);
    if (!all.length){ host.innerHTML = `<div class="msg">입력된 값이 없습니다</div>`; return; }
    let lo = spec.type === "bar" || spec.zero ? 0 : Math.min(...all), hi = Math.max(...all);
    if (spec.type === "line" && !spec.zero){ const pad = (hi - lo) * 0.25 || hi * 0.02 || 1; lo -= pad; hi += pad; if (all.every(v => v >= 0)) lo = Math.max(lo, 0); }
    if (hi === lo) hi = lo + 1;
    const step = niceStep(hi - lo, 4); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const y = v => M.t + ph - (v - lo) / (hi - lo) * ph, xc = i => M.l + bw * (i + 0.5);
    let g = `<rect class="hl" x="0" y="${M.t}" width="0" height="${ph}" rx="6"/>`;
    for (let t = lo; t <= hi + step / 2; t += step)
      g += `<line class="grid" x1="${M.l}" x2="${W - M.r}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${M.l - 8}" y="${y(t) + 4}" text-anchor="end">${compact(t)}</text>`;
    spec.labels.forEach((l,i) => g += `<text class="ax" x="${xc(i)}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>`);
    let marks = "";
    if (spec.type === "bar"){
      const k = spec.series.length, gw = Math.min(bw * 0.7, 30 * k + 2 * (k - 1)), w = (gw - 2 * (k - 1)) / k;
      spec.series.forEach((s,si) => s.values.forEach((v,i) => {
        if (v === null) return;
        const x = xc(i) - gw / 2 + si * (w + 2), top = y(v), base = y(lo), r = Math.min(4, w / 2, Math.max(base - top, 0));
        marks += `<path d="M${x},${base}V${top + r}Q${x},${top} ${x + r},${top}H${x + w - r}Q${x + w},${top} ${x + w},${top + r}V${base}Z" fill="var(--s${s.color})"/>`;
      }));
    } else {
      spec.series.forEach(s => {
        let d = "", pen = false;
        s.values.forEach((v,i) => { if (v === null){ pen = false; return; } d += (pen ? "L" : "M") + xc(i) + "," + y(v); pen = true; });
        marks += `<path d="${d}" fill="none" stroke="var(--s${s.color})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
        s.values.forEach((v,i) => { if (v !== null) marks += `<circle cx="${xc(i)}" cy="${y(v)}" r="4.5" fill="var(--s${s.color})" stroke="var(--panel)" stroke-width="2"/>`; });
        if (spec.series.length === 1){
          const idx = s.values.map((v,i) => v !== null ? i : -1).filter(i => i >= 0), li = idx[idx.length - 1];
          if (li !== undefined) marks += `<text class="dl" x="${xc(li)}" y="${y(s.values[li]) - 11}" text-anchor="${li === n - 1 ? "end" : "middle"}">${fmtN(s.values[li])}</text>`;
        }
      });
    }
    let hits = ""; for (let i = 0; i < n; i++) hits += `<rect data-i="${i}" x="${M.l + bw * i}" y="${M.t}" width="${bw}" height="${ph}" fill="transparent"/>`;
    host.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(spec.title || "")}">${g}${marks}${hits}</svg><div class="tip" hidden></div>`;
    const tip = $(".tip", host), hl = $(".hl", host);
    host.querySelectorAll("rect[data-i]").forEach(r => {
      const show = () => {
        const i = +r.dataset.i;
        const lines = spec.series.map(s => `<div><i style="background:var(--s${s.color})"></i>${esc(s.name)} <b style="display:inline">${s.values[i] === null ? "값 없음" : fmtN(s.values[i])}</b></div>`)
          .concat((spec.extra || []).map(e => e.values[i] === null ? "" : `<div class="muted">${esc(e.name)} ${fmtN(e.values[i])}</div>`)).join("");
        tip.innerHTML = `<b>${esc(spec.labels[i])}</b>${lines}`; tip.hidden = false;
        tip.style.left = Math.min(Math.max(xc(i), 80), W - 80) + "px";
        hl.setAttribute("x", M.l + bw * i + 2); hl.setAttribute("width", Math.max(bw - 4, 0));
      };
      r.addEventListener("pointerenter", show); r.addEventListener("pointerdown", show);
    });
    host.querySelector("svg").addEventListener("pointerleave", () => { tip.hidden = true; hl.setAttribute("width", 0); });
  };
  draw();
  if (window.ResizeObserver) new ResizeObserver(() => { if (host.clientWidth !== lastW) draw(); }).observe(host);
}

    series:[R.lg && {name:"롱폼", color:1, values:slice(R.lg, spYT)}, R.sh && {name:"숏폼", color:2, values:slice(R.sh, spYT)}].filter(Boolean)});
  if (spIGF) charts.push({id:"c3", title:"IG 팔로워 추이", type:"line", labels:labels(spIGF), series:[{name:"IG 팔로워", color:3, values:slice(R.igf, spIGF)}],
    note:"세로축이 0부터 시작하지 않아 작은 변화도 크게 보입니다 · 빈 달은 미입력"});
  if (spIGV) charts.push({id:"c4", title:"IG 조회수", type:"bar", labels:labels(spIGV), series:[{name:"IG 조회수", color:3, values:slice(R.igv, spIGV)}],
    extra: R.rc ? [{name:"반응수", values:slice(R.rc, spIGV)}] : [], note:"막대에 마우스를 올리면 반응수도 함께 보입니다 · 빈 달은 미입력"});

  const targets = R.tg ? R.tg.raw.map((t,i) => ({m: d.months[i], t})).filter(x => x.t && x.t !== "-") : [];

    const s = r.values.filter(v => v !== null); return s.length ? fmtN(s.reduce((a,v) => a + v, 0)) : ""; };

    <section class="panel" style="padding:12px">

          <td class="num">${esc(cum(r) || (blank ? "-" : ""))}</td>${r.raw.map((v,i) => `<td class="${r.text ? "" : "num"}">${r.values[i] !== null ? fmtN(r.values[i]) : `<span class="muted">${esc(v || (blank ? "-" : ""))}</span>`}</td>`).join("")}</tr>`).join("")}</tbody>

/* ======================= 광고 매출 ======================= */
const fmtWon = v => "₩" + Math.round(v).toLocaleString("ko-KR");
const fmtMan = v => v >= 1e8 ? (v / 1e8).toFixed(2).replace(/\.?0+$/, "") + "억원"
                  : v % 1e4 === 0 ? (v / 1e4).toLocaleString("ko-KR") + "만원" : fmtWon(v);
const STATUS = { "완료": {label:"업로드 완료", c:3}, "예정": {label:"업로드 예정", c:1}, "미정": {label:"업로드일 미정", c:0} };
function revenueSummary(d, R){
  const H = d.headers, at = h => H.indexOf(h);
  const ai = at(R.amountCol), di = at(R.dateCol);
  const rows = d.data.map(r => {
    const amount = num(r[ai]) || 0, date = parseDate(r[di]);
    const status = !date ? "미정" : dayDiff(date) <= 0 ? "완료" : "예정";
    return {r, amount, date, status, get: h => { const i = at(h); return i >= 0 ? r[i] : ""; }};
  }).filter(x => x.amount || x.get(R.brandCol));
  const sum = a => a.reduce((t,x) => t + x.amount, 0);
  const done = rows.filter(x => x.status === "완료"), rest = rows.filter(x => x.status !== "완료");
  const money = rows.every(x => x.amount % 1e4 === 0) ? fmtMan : fmtWon;
  const unpriced = rows.filter(x => !x.amount);
  return {rows, total: sum(rows), done, doneSum: sum(done), rest, restSum: sum(rest), sum, money, unpriced};
}
function barList(groups, total, color, money = fmtMan){

    <div class="bl-track"><div class="bl-bar" style="width:${(v/max*100).toFixed(1)}%;background:var(--s${Array.isArray(color) ? color[gi] : color})"></div></div></li>`).join("")}</ul>`;
}
function renderRevenuePage(view, p, d){

      <div class="tiles">${[["총 광고 매출","0원","VAT 제외 · 확정 0건"],["업로드 완료","0원","0건"],["업로드 예정·미정","0원","0건"],["평균 단가","-",""]]

  const undated = rows.filter(x => !x.date);

  const best = rows.reduce((a,b) => b.amount > (a ? a.amount : -1) ? b : a, null);
  const priced = rows.length - S.unpriced.length, avg = S.total / (priced || 1);
  const noPrice = S.unpriced.length ? ` · 매출 집계 전 ${S.unpriced.length}건` : "";
  const tiles = [
    ["총 광고 매출", M(S.total), `VAT 제외 · 확정 ${rows.length}건${noPrice}`],
    ["업로드 완료", S.done.length ? M(S.doneSum) : "없음", S.done.length ? `${S.done.length}건 · 전체의 ${S.total ? (S.doneSum / S.total * 100).toFixed(0) : 0}%` : "아직 업로드된 건 없음"],
    ["업로드 예정·미정", !S.rest.length ? "없음" : S.restSum ? M(S.restSum) : `${S.rest.length}건`, S.rest.length ? `${S.rest.length}건 · ${S.rest.map(x => x.get(R.brandCol) + (x.amount ? "" : "(매출 집계 전)")).join(", ")}` : "모든 건 업로드 완료"],
    ["평균 단가", M === fmtMan ? fmtMan(Math.round(avg / 1e4) * 1e4) : fmtWon(avg), best ? `최고 ${M(best.amount)} · ${rows.filter(x => x.amount === best.amount).map(x => x.get(R.brandCol)).join(", ")}` : ""]
  ];
  // 설정에 typeCol(예: "유형")이 있고 2가지 이상이면 유형별로 나눠서 보여줌
  const types = R.typeCol ? group(R.typeCol) : [];
  const split = types.length > 1;
  if (split) tiles.splice(1, 0, ...types.map(([k,v,n]) => [`${k} 매출`, M(v), `${n}건 · 전체의 ${S.total ? (v / S.total * 100).toFixed(0) : 0}%`]));

  // 표: 예정·미정 먼저, 그다음 완료(최근 업로드 순)
  const order = {"미정":0, "예정":1, "완료":2};
  const sorted = rows.slice().sort((a,b) => order[a.status] - order[b.status] || (b.date || 0) - (a.date || 0));
  const first = [R.dateCol, R.brandCol, R.productCol, R.amountCol, R.channelCol].map(h => d.headers.indexOf(h)).filter(i => i >= 0);
  const cols = [...first, ...d.headers.map((h,i) => i).filter(i => !first.includes(i))]
    .filter(i => rows.some(x => x.r[i]) && !(p.hide || []).includes(d.headers[i]));
  const amtI = d.headers.indexOf(R.amountCol);
  const dateLike = i => rows.filter(x => x.r[i]).every(x => parseDate(x.r[i]));

  view.innerHTML = `
    <h2 class="page-title">${esc(p.label)}</h2>
    <p class="page-sub">${esc(p.title || d.title)} · 금액은 모두 VAT 제외 · 업로드일 기준으로 집계</p>
    <div class="tiles">${tiles.map(([k,v,s]) => `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="s">${esc(s)}</div></div>`).join("")}</div>
    <div class="rev-grid">
      <section class="panel"><div class="panel-h"><h2>월별 광고 매출</h2><div class="grow"></div><span class="muted" style="font-size:12px">업로드일 기준</span></div>
        <div class="panel-b">${months.length ? `<div class="chart" id="revChart"></div>
          ${split ? `<div class="chart-legend">${types.map(([k],i) => `<span><i style="background:var(--s${i + 1})"></i>${esc(k)}</span>`).join("")}</div>` : ""}
          <div class="panel-note">${months.map((o,i) => `${mLabel(o)} ${o.n ? M(o.v) + (split ? ` (${types.map(([k]) => { const v = typeSum(o, k); return v ? `${k} ${M(v)}` : ""; }).filter(Boolean).join(" · ")})` : "") : "없음"}`).join(" · ")}${months.length ? ` · 누적 ${M(cum[cum.length - 1])}` : ""}</div>` : `<div class="msg">업로드일이 입력된 건이 없습니다</div>`}
          ${undated.length ? `<div class="notice" style="margin:10px 0 0">업로드일 미정 ${undated.length}건(${M(S.sum(undated))})은 그래프에서 빠져 있어요 · ${undated.map(x => esc(x.get(R.brandCol) + " " + x.get(R.productCol))).join(", ")}</div>` : ""}
        </div></section>
      <div class="side-stack">
        ${split ? `<section class="panel"><div class="panel-h"><h2>${esc(R.typeCol)}별</h2></div><div class="panel-b">${barList(types, S.total, types.map((t,i) => i + 1), M)}</div></section>` : ""}
        <section class="panel"><div class="panel-h"><h2>${esc(R.channelCol)}별</h2></div><div class="panel-b">${barList(group(R.channelCol), S.total, 1, M)}</div></section>
        <section class="panel"><div class="panel-h"><h2>카테고리별</h2></div><div class="panel-b">${barList(group(R.categoryCol), S.total, 2, M)}</div></section>
      </div>
    </div>
    <section class="panel" style="padding:12px">
      <div class="panel-h" style="padding:2px 4px 10px"><h2>광고 확정 건</h2><div class="grow"></div><span class="muted" style="font-size:12px">${rows.length}건</span></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>상태</th>${cols.map(i => `<th class="${i === amtI ? "num" : ""}">${esc(d.headers[i])}</th>`).join("")}</tr></thead>
        <tbody>${sorted.map(x => `<tr><td><span class="st"><i style="background:var(--s${STATUS[x.status].c})"></i>${STATUS[x.status].label}</span></td>${cols.map(i => {
          const v = x.r[i];
          if (i === amtI) return `<td class="num">${x.amount ? fmtWon(x.amount) : '<span class="muted">집계 전</span>'}</td>`;
          const em = v.match(/^\s*"?([^"<]*?)"?\s*<([^>\s]+@[^>\s]+)>\s*$/);
          if (em) return `<td>${esc(em[1].trim() || em[2])}<br><a href="mailto:${esc(em[2])}" class="muted" style="font-size:12px">${esc(em[2])}</a></td>`;
          if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return `<td><a href="mailto:${esc(v)}">${esc(v)}</a></td>`;
          return `<td class="${dateLike(i) ? "nowrap" : ""}">${esc(v)}</td>`;
        }).join("")}</tr>`).join("")}</tbody>
        <tfoot><tr><td>합계</td>${cols.map(i => i === amtI ? `<td class="num">${fmtWon(S.total)}</td>` : "<td></td>").join("")}</tr></tfoot>
      </table></div>
    </section>`;
  if (months.length) mountChart($("#revChart"), {title:"월별 광고 매출", type:"bar", labels: months.map(mLabel),

                  : [{name:"광고 매출", color:1, values: months.map(o => o.n ? o.v : null)}],
    extra: [...(split ? [{name:"월 합계", values: months.map(o => o.n ? o.v : null)}] : []), {name:"건수", values: months.map(o => o.n)}, {name:"누적 매출", values: cum}]});
}

const store = {};      // id → parsed
let latestMod = null;
async function loadPage(p){
  if (store[p.id]) return store[p.id];
  try {
    const {rows, modified} = await fetchRows(p.file);
    if (modified){ const d = new Date(modified); if (!latestMod || d > latestMod) latestMod = d; }
    const isCal = rows.some(r => r.some(c => /^\d{1,2}월\s*스케줄$/.test(c)));
    const isMetrics = rows.some(r => r.filter(c => /^\d{1,2}월$/.test(c)).length >= 6);
    if (p.type === "ideas"){ store[p.id] = parseIdeas(rows); return store[p.id]; }
    store[p.id] = !rows.length ? {kind:"empty"} : isCal ? parseCalendar(rows) : isMetrics ? parseMetrics(rows) : parseTable(rows);
  } catch(e){ store[p.id] = {kind:"error", message:e.message}; }
  return store[p.id];
}

function buildLayers(){
  const layers = [];
  CONFIG.pages.forEach(p => {
    const d = store[p.id]; if (!d) return;
    if (p.layer && d.kind === "calendar"){
      layers.push({id:p.id, label:p.layer.label, color:p.layer.color, off:!!p.layer.off,
        events: d.events.map(e => ({...e, tent:/예정/.test(e.text), ad:/광고|PPL|협찬|공구|마켓/i.test(e.text)})),
        notes: d.notes, warns: d.warns || []});
    }
    if (p.dateLayer && d.kind === "table"){
      const L = p.dateLayer, di = d.headers.indexOf(L.col);
      if (di < 0) return;
      const ti = (L.titleCols || []).map(h => d.headers.indexOf(h)).filter(i => i >= 0);
      const events = d.data.map(r => {
        const date = parseDate(r[di]); if (!date) return null;
        const text = ti.map(i => r[i]).filter(Boolean).join(" · ") || L.label;
        return {date, text, tent:false, ad:p.id === CONFIG.home.inquiries.page};
      }).filter(Boolean);
      layers.push({id:p.id+"-date", label:L.label, color:L.color, off:!!L.off, events, notes:[]});
    }
  });
  return layers;
}
const layerState = {};   // 범례 on/off 기억
const isOn = l => layerState[l.id] ?? !l.off;

function calendarPanel(layers, opts={}){
  const wrap = document.createElement("section");
  wrap.className = "panel";
  let cur = new Date(today.getFullYear(), today.getMonth(), 1);
  let sel = null;

  const draw = () => {
    const y = cur.getFullYear(), m = cur.getMonth();
    const first = new Date(y, m, 1), days = new Date(y, m+1, 0).getDate();
    const active = layers.filter(isOn);
    const evOn = d => active.flatMap(l => l.events.filter(e => sameDay(e.date, d)).map(e => ({...e, layer:l})));
    let cells = DOW.map((d,i) => `<div class="dow ${i===0?"sun":i===6?"sat":""}">${d}</div>`).join("");
    for (let i = 0; i < first.getDay(); i++) cells += `<div class="day out"></div>`;
    for (let dn = 1; dn <= days; dn++){
      const d = new Date(y, m, dn), evs = evOn(d);
      const shown = evs.slice(0, 3).map(e =>
        `<span class="ev ${e.tent?"tent":""}" style="--c:var(--s${e.layer.color})" title="${esc(e.layer.label+": "+e.text)}">${esc(e.text)}</span>`).join("");
      cells += `<div class="day ${sameDay(d,today)?"today":""} ${sameDay(d,sel)?"sel":""}" data-d="${dn}">
        <span class="n">${dn}</span>${shown}${evs.length>3?`<div class="more">+${evs.length-3}</div>`:""}</div>`;
    }
    const rest = (7 - (first.getDay()+days) % 7) % 7;
    for (let i = 0; i < rest; i++) cells += `<div class="day out"></div>`;

    let detail = "";
    if (sel && sel.getMonth() === m){
      const evs = evOn(sel);
      detail = `<div class="day-detail"><h3>${sel.getMonth()+1}월 ${sel.getDate()}일 (${DOW[sel.getDay()]}) · ${ddLabel(sel)}</h3>
        ${evs.length ? `<ul class="list">${evs.map(e => eventLi(e, false)).join("")}</ul>` : `<div class="muted">등록된 일정이 없습니다</div>`}</div>`;
    }
    wrap.innerHTML = `
      <div class="panel-h">
        <h2>${esc(opts.title || "일정 달력")}</h2><div class="grow"></div>
        <div class="cal-nav">
          <button class="icon-btn" data-nav="-1" aria-label="이전 달">‹</button>
          <span class="m">${y}년 ${m+1}월</span>
          <button class="icon-btn" data-nav="1" aria-label="다음 달">›</button>
          <button class="icon-btn" data-nav="0">오늘</button>
        </div>
      </div>
      ${layers.length > 1 ? `<div class="legend">${layers.map(l =>
        `<button data-l="${l.id}" class="${isOn(l)?"":"off"}" aria-pressed="${isOn(l)}"><span class="sw" style="background:var(--s${l.color})"></span>${esc(l.label)} <span class="muted">${l.events.length}</span></button>`).join("")}</div>` : ""}
      <div style="padding:0 16px 16px"><div class="cal">${cells}</div></div>${detail}`;

    wrap.querySelectorAll("[data-nav]").forEach(b => b.onclick = () => {
      const n = +b.dataset.nav;
      cur = n === 0 ? new Date(today.getFullYear(), today.getMonth(), 1) : new Date(y, m+n, 1);
      if (n === 0) sel = today;
      draw();
    });
    wrap.querySelectorAll("[data-l]").forEach(b => b.onclick = () => {
      const l = layers.find(x => x.id === b.dataset.l); layerState[l.id] = !isOn(l);
      draw(); opts.onLayer && opts.onLayer();
    });
    wrap.querySelectorAll(".day[data-d]").forEach(c => c.onclick = () => {
      const d = new Date(y, m, +c.dataset.d); sel = sameDay(sel, d) ? null : d; draw();
    });
  };
  draw();
  return wrap;
}

const uniqRange = list => { const seen = new Set(); return list.filter(e => { if (!e.range) return true; const k = e.layer.id + "|" + e.text; if (seen.has(k)) return false; seen.add(k); return true; }); };
function eventLi(e, withDate=true){
  const n = dayDiff(e.date);
  return `<li>
    ${withDate ? `<span class="dd ${n===0?"d0":""}">${ddLabel(e.date)}</span>` : ""}
    <div class="body">
      <div class="t">${esc(e.text)}${e.ad?'<span class="tag-ad">광고</span>':""}</div>
      <div class="meta"><span class="sw" style="background:var(--s${e.layer.color})"></span>${esc(e.layer.label)}${withDate?" · "+fmtDate(e.date):""}${e.tent?" · 예정":""}${e.range?` · ${e.days}일간 (${e.day}일차)`:""}</div>
    </div></li>`;
}

// 아이템 리스트: "주제(제목)" 머리글 아래 줄을 아이템으로 읽음 (제목이 빈 줄은 건너뜀)
function parseIdeas(rows){
  const cl = s => String(s || "").replace(/\s+/g, " ").trim();
  const hi = rows.findIndex(r => r.some(c => cl(c).startsWith("주제")));
  if (hi < 0) return {kind:"ideas", items:[], noHeader:true};
  const H = rows[hi], ti = H.findIndex(c => cl(c).startsWith("주제"));
  const fields = H.map((h,i) => ({i, h: cl(h)})).filter(f => f.i !== ti && !/^no\.?$/i.test(f.h));
  const items = [];
  for (let i = hi + 1; i < rows.length; i++){
    const r = rows[i] || [], title = (r[ti] || "").trim();
    if (!title) continue;
    const data = {}, links = [];
    fields.forEach(f => {
      const val = (r[f.i] || "").trim(); if (!val) return;
      (val.match(/https?:\/\/[^\s,]+/g) || []).forEach(u => links.push(u));
      data[f.h || "기타"] = val;
    });
    const kwKey = Object.keys(data).find(k => k.includes("키워드"));
    items.push({title, data, links:[...new Set(links)],
      keywords: kwKey ? data[kwKey].split(/\n|,|#/).map(cl).filter(Boolean) : [],
      planned: Object.keys(data).filter(k => !k.includes("키워드") && !k.includes("레퍼런스")).length >= 2});
  }
  return {kind:"ideas", items};
}
function renderIdeasPage(view, p, d){
  const items = d.items || [], planned = items.filter(x => x.planned), rough = items.filter(x => !x.planned);
  const kw = {}; items.forEach(x => x.keywords.forEach(k => kw[k] = (kw[k] || 0) + 1));
  const topKw = Object.entries(kw).sort((a,b) => b[1] - a[1]).slice(0, 3).map(k => k[0]);
  const tiles = [["전체 아이템", items.length + "개", ""], ["기획안", planned.length + "개", "기획 의도·플롯 작성"],
                 ["아이디어", rough.length + "개", "제목만 작성"], ["자주 쓴 키워드", topKw[0] || "-", topKw.slice(1).join(" · ")]];
  const order = ["내용", "기획의도", "타겟", "전체 플롯", "연출 포인트", "컨셉", "레퍼런스"];

    <div class="toolbar" style="margin-bottom:12px"><input type="search" id="idq" placeholder="제목, 내용, 키워드 검색" aria-label="아이템 검색"></div>
    <section class="panel" style="margin-bottom:16px"><div class="panel-h"><h2>기획안</h2><div class="grow"></div><span class="muted" style="font-size:12px">기획 의도 · 플롯이 정리된 아이템</span></div>
      <div class="panel-b"><div class="ideas" id="id-planned"></div></div></section>
    <section class="panel"><div class="panel-h"><h2>아이디어</h2><div class="grow"></div><span class="muted" style="font-size:12px">제목만 적어 둔 아이템</span></div>
      <div class="panel-b"><ul class="idea-list" id="id-rough"></ul></div></section>`;
  const draw = () => {
    const q = $("#idq").value.trim().toLowerCase();
    const match = x => !q || (x.title + " " + Object.values(x.data).join(" ")).toLowerCase().includes(q);
    const pf = planned.filter(match), rf = rough.filter(match);

    $("#id-planned").innerHTML = pf.length ? pf.map(x => {
      const onlyUrl = v => /^(\s*https?:\/\/[^\s,]+[\s,]*)+$/.test(v);   // 주소만 있는 칸은 '참고 링크'로 보여줌
      const keys = Object.keys(x.data).filter(k => !k.includes("키워드") && !onlyUrl(x.data[k])).sort((a,b) => rank(a) - rank(b));
      const lead = x.data["내용"] || x.data[keys[0]] || "";
      return `<article class="idea"><h4>${esc(x.title)}</h4>
        ${x.data["컨셉"] ? `<span class="idea-pill">${esc(x.data["컨셉"])}</span>` : ""}
        ${lead ? `<p>${esc(lead.length > 140 ? lead.slice(0, 140) + "…" : lead)}</p>` : ""}
        ${x.keywords.length ? `<div class="kw">${x.keywords.map(k => `<span>#${esc(k)}</span>`).join("")}</div>` : ""}
        <details><summary>기획 내용 보기</summary><dl>${keys.map(k => `<div><dt>${esc(k)}</dt><dd>${esc(x.data[k])}</dd></div>`).join("")}
        ${x.links.length ? `<div><dt>참고 링크</dt><dd>${x.links.map((u,i) => `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">참고 ${i+1} ↗</a>`).join(" · ")}</dd></div>` : ""}</dl></details></article>`;
    }).join("") : none;
    $("#id-rough").innerHTML = rf.length ? rf.map(x => `<li>${esc(x.title)}${x.links.length ? ` <a href="${esc(x.links[0])}" target="_blank" rel="noopener noreferrer">↗</a>` : ""}</li>`).join("") : `<li style="list-style:none;margin-left:-18px">${none}</li>`;
  };
  $("#idq").addEventListener("input", draw);
  draw();
}

function renderHome(view){
  const layers = buildLayers();
  const H = CONFIG.home;
  const inq = store[H.inquiries?.page], con = store[H.contents?.page];
  const col = (t, h) => t && t.kind === "table" ? t.headers.indexOf(h) : -1;

  // --- 요약 타일
  const tiles = [];
  const allOn = () => layers.filter(isOn).flatMap(l => l.events.map(e => ({...e, layer:l})));
  const upcomingAll = uniqRange(allOn().filter(e => dayDiff(e.date) >= 0).sort((a,b) => a.date - b.date));
  const next = upcomingAll[0];
  tiles.push(["다음 일정", next ? ddLabel(next.date) : "—", next ? `${fmtDate(next.date)} ${next.text}` : "예정된 일정 없음"]);
  const monthEv = uniqRange(allOn().filter(e => e.date.getMonth()===today.getMonth() && e.date.getFullYear()===today.getFullYear()));
  tiles.push([`${today.getMonth()+1}월 일정`, monthEv.length + "건", `광고 ${monthEv.filter(e=>e.ad).length}건 포함`]);
  if (inq && inq.kind === "table"){
    const ti = col(inq, H.inquiries.typeCol);
    const counts = {};
    if (ti >= 0) inq.data.forEach(r => { if (r[ti]) counts[r[ti]] = (counts[r[ti]]||0)+1; });
    const top = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v]) => `${k} ${v}`).join(" · ");
    tiles.push([CONFIG.pages.find(x => x.id === H.inquiries.page)?.label || "문의", inq.data.length + "건", inq.data.length ? (top || "—") : "-"]);
  }
  const rv = H.revenue && store[H.revenue.page], rvp = H.revenue && CONFIG.pages.find(x => x.id === H.revenue.page);
  if (rv && rv.kind === "table" && rvp){
    const S = revenueSummary(rv, rvp.revenue);
    if (!S.rows.length) tiles.push(["광고 매출", "0원", "VAT 제외 · 확정 0건"]);
    else {
    const R2 = rvp.revenue, tm = new Map();
    if (R2.typeCol) S.rows.forEach(x => { const k = (x.get(R2.typeCol) || "").trim() || "(미입력)"; tm.set(k, (tm.get(k) || 0) + x.amount); });
    if (tm.size > 1) tiles.push(["광고 매출", S.money(S.total), [...tm].sort((a,b) => b[1] - a[1]).map(([k,v]) => `${k} ${S.money(v)}`).join(" · ")]);
    else tiles.push(["광고 매출", S.money(S.total), `VAT 제외 · 확정 ${S.rows.length}건 · ${S.done.length ? "업로드 완료 " + S.money(S.doneSum) : "아직 업로드 전"}${S.unpriced.length ? ` · 매출 집계 전 ${S.unpriced.length}건` : ""}`]);
    }
  }
  const ch = store[CONFIG.channel?.page];
  if (ch && ch.kind === "metrics"){
    const S = channelSummary(ch);
    if (S.subs) tiles.push(["YT 구독자", fmtN(S.subs.v), `${S.subs.m} 기준${S.subs.dv !== null ? ` · ${S.subs.pm} 대비 ${signed(S.subs.dv)}` : ""}`]);
    else if (S.igf){ const prev = S.igf.dv !== null ? S.igf.v - S.igf.dv : null, odd = prev && (S.igf.v / prev >= 5 || S.igf.v / prev <= 0.2);
      tiles.push(["IG 팔로워", fmtN(S.igf.v), odd ? `⚠️ ${S.igf.pm} ${fmtN(prev)}와 차이가 커요 · 시트 값 확인 필요` : `${S.igf.m} 기준${S.igf.dv !== null ? ` · ${S.igf.pm} 대비 ${signed(S.igf.dv)}` : ""}`]); }
    if (S.yt) tiles.push([`${S.yt.m} YT 조회수`, compact(S.yt.v), `롱폼 ${S.yt.long !== null ? compact(S.yt.long) : "-"} · 숏폼 ${S.yt.short !== null ? compact(S.yt.short) : "-"}`]);
    else if (S.igv) tiles.push([`${S.igv.m} IG 조회수`, compact(S.igv.v), S.igv.dv !== null ? `${S.igv.pm} 대비 ${signed(S.igv.dv)}` : ""]);
  }
  let recent = [];
  if (con && con.kind === "table"){
    const di = col(con, H.contents.dateCol), vi = col(con, H.contents.viewsCol), fi = col(con, H.contents.formatCol), ti = col(con, H.contents.titleCol);
    const rows = con.data;
    const views = vi >= 0 ? rows.reduce((a,r) => a + (num(r[vi]) || 0), 0) : 0;
    const fmt = {}; if (fi >= 0) rows.forEach(r => { if (r[fi]) fmt[r[fi]] = (fmt[r[fi]]||0)+1; });
    tiles.push(["업로드 콘텐츠", rows.length + "개", Object.entries(fmt).map(([k,v]) => `${k} ${v}`).join(" · ")]);
    if (vi >= 0) tiles.push(["영상 조회수 합계", compact(views), `콘텐츠 시트 기준 · 평균 ${compact(views / (rows.length||1))}회`]);
    recent = rows.map(r => ({r, d: parseDate(r[di])})).filter(x => x.d).sort((a,b) => b.d - a.d).slice(0, 5)
      .map(({r,d}) => ({d, title: r[ti] || "", fmt: fi>=0 ? r[fi] : "", views: vi>=0 ? r[vi] : ""}));
  }

  // 설정의 home.hideTiles 에 적힌 단어가 들어간 카드는 메인에서 숨김
  const hideT = H.hideTiles || [];
  for (let i = tiles.length - 1; i >= 0; i--) if (hideT.some(w => tiles[i][0].includes(w))) tiles.splice(i, 1);

  // 안내문(※…)은 맨 위, 나머지 비고는 옆 패널
  const notes = [...new Set(layers.flatMap(l => l.notes))];
  const disclaimers = notes.filter(n => n.startsWith("※"));
  const memo = layers.map(l => ({l, notes: l.notes.filter(n => !n.startsWith("※"))})).filter(x => x.notes.length);

  view.innerHTML = `
    <div class="tiles">${tiles.map(([k,v,s]) => `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="s" title="${esc(s)}">${esc(s)}</div></div>`).join("")}</div>
    ${layers.flatMap(l => l.warns || []).map(w => `<div class="notice" style="color:#b45309">⚠️ ${esc(w)}</div>`).join("")}
    ${disclaimers.map(d => `<div class="notice">${esc(d)}</div>`).join("")}
    ${rateHTML()}
    <div class="home-grid">
      <div id="calSlot"></div>
      <div class="side">
        <section class="panel"><div class="panel-h"><h2>다가오는 일정</h2><div class="grow"></div><span class="muted" style="font-size:12px">30일</span></div>
          <div class="panel-b" id="upcoming"></div></section>
        ${recent.length ? `<section class="panel"><div class="panel-h"><h2>최근 업로드</h2></div><div class="panel-b">
          <ul class="list">${recent.map(x => `<li><span class="dd">${x.d.getMonth()+1}/${x.d.getDate()}</span>
            <div class="body"><div class="t">${esc(x.title)}</div><div class="meta">${esc(x.fmt)}</div></div>
            <span class="num">${x.views ? "▶ "+esc(x.views) : ""}</span></li>`).join("")}</ul></div></section>` : ""}
        ${memo.length ? `<section class="panel"><div class="panel-h"><h2>비고 · 전달사항</h2></div><div class="panel-b">
          ${memo.map(x => `<div class="meta" style="font-size:12px;color:var(--muted);margin:4px 0"><span class="sw" style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--s${x.l.color})"></span> ${esc(x.l.label)}</div>
            ${x.notes.map(n => `<div class="notice">${esc(n)}</div>`).join("")}`).join("")}
        </div></section>` : ""}
      </div>
    </div>`;

  const drawUpcoming = () => {
    const list = layers.filter(isOn).flatMap(l => l.events.map(e => ({...e, layer:l})))
      .filter(e => { const n = dayDiff(e.date); return n >= 0 && n <= 30; })
      .sort((a,b) => a.date - b.date);
    const shown = uniqRange(list); list.length = 0; list.push(...shown);
    $("#upcoming").innerHTML = list.length ? `<ul class="list">${list.map(e => eventLi(e)).join("")}</ul>`
      : `<div class="muted">앞으로 30일 안에 등록된 일정이 없습니다</div>`;
  };
  $("#calSlot").appendChild(calendarPanel(layers, {title:"광고 · 업로드 · 개인 일정", onLayer: drawUpcoming}));
  drawUpcoming();
}

function renderCalendarPage(view, p, d){

  const up = uniqRange(evs.filter(e => dayDiff(e.date) >= 0)), past = uniqRange(evs.filter(e => dayDiff(e.date) < 0).reverse()).reverse();
  view.innerHTML = `
    <h2 class="page-title">${esc(p.label)}</h2>
    <p class="page-sub">전체 ${evs.length}건 · 예정 ${up.length}건 · 지난 일정 ${past.length}건</p>
    ${d.notes.map(n => `<div class="notice">${esc(n)}</div>`).join("")}
    <div class="home-grid"><div id="calSlot"></div>
      <div class="side">
        <section class="panel"><div class="panel-h"><h2>예정</h2></div><div class="panel-b">
          ${up.length ? `<ul class="list">${up.map(e => eventLi(e)).join("")}</ul>` : `<div class="muted">예정된 일정이 없습니다</div>`}</div></section>
        ${past.length ? `<section class="panel"><div class="panel-h"><h2>지난 일정</h2></div><div class="panel-b">
          <ul class="list">${past.reverse().map(e => eventLi(e)).join("")}</ul></div></section>` : ""}
      </div></div>`;
  $("#calSlot").appendChild(calendarPanel([layer], {title: p.label}));
}

/* ======================= 표 시트 탭 ======================= */
// 반응 분석: 포맷별 중앙값 대비 조회수·참여율로 등급을 매기고 "반응"/"조회수 배수" 열을 추가
const median = a => { const b = a.slice().sort((x,y) => x-y), n = b.length; return n ? (n % 2 ? b[(n-1)/2] : (b[n/2-1] + b[n/2]) / 2) : 0; };
function addReaction(d, R){
  const H = d.headers, gi = H.indexOf(R.groupCol), ti = H.indexOf(R.titleCol), vi = H.indexOf(R.viewsCol),
        li = H.indexOf(R.likeCol), ci = H.indexOf(R.commentCol);
  if (vi < 0) return {d, html:""};
  const info = d.data.map(r => {
    const v = num(r[vi]), e = v ? ((num(r[li]) || 0) + (num(r[ci]) || 0)) / v : null;
    return {g: gi >= 0 ? (r[gi] || "기타") : "전체", v, e};
  });
  const groups = {};
  info.forEach(x => { if (x.v) (groups[x.g] ||= {vs:[], es:[]}).vs.push(x.v), groups[x.g].es.push(x.e); });
  Object.values(groups).forEach(g => { g.mv = median(g.vs); g.me = median(g.es); });
  info.forEach(x => {
    const g = groups[x.g]; x.label = ""; x.ratio = null;
    if (!x.v || !g) return;
    x.ratio = x.v / g.mv;
    if (x.ratio >= R.hot) x.label = "🔥 화제";
    else if (x.ratio >= R.high) x.label = "👍 조회수 높음";
    else if (x.e >= g.me * R.engage && x.ratio >= 0.5) x.label = "💬 참여율 높음";
  });
  const at = ti >= 0 ? ti + 1 : H.length;
  const nd = {...d,
    headers: [...H.slice(0, at), "반응", "조회수 배수", ...H.slice(at)],
    data: d.data.map((r,i) => [...r.slice(0, at), info[i].label, info[i].ratio ? info[i].ratio.toFixed(1) + "배" : "", ...r.slice(at)])};

  // 포맷별 TOP
  const rows = d.data.map((r,i) => ({r, ...info[i]})).filter(x => x.v);
  const html = Object.keys(groups).map(g => {
    const top = rows.filter(x => x.g === g).sort((a,b) => b.v - a.v).slice(0, R.top);
    const cnt = rows.filter(x => x.g === g && x.label).length;
    return `<section class="panel"><div class="panel-h"><h2>${esc(g)} 반응 TOP ${R.top}</h2><div class="grow"></div>
      <span class="muted" style="font-size:12px">중앙값 ${compact(groups[g].mv)}회 · 반응 좋음 ${cnt}개</span></div>
      <div class="panel-b"><ul class="list">${top.map((x,k) => `<li><span class="dd ${k===0?"d0":""}">${k+1}위</span>
        <div class="body"><div class="t">${esc(x.r[ti] || "")}</div>
        <div class="meta">${esc(x.label || "")}${x.label?" · ":""}중앙값의 ${x.ratio.toFixed(1)}배 · 참여율 ${(x.e*100).toFixed(1)}%</div></div>
        <span class="num">▶ ${esc(x.r[vi])}</span></li>`).join("")}</ul></div></section>`;
  }).join("");
  const note = `<div class="notice" style="margin-top:0">반응 기준 (롱폼·숏폼 각각 따로 비교) — 🔥 화제: 조회수가 같은 포맷 중앙값의 ${R.hot}배 이상 · 👍 조회수 높음: ${R.high}배 이상 · 💬 참여율 높음: (좋아요+댓글)÷조회수가 중앙값의 ${R.engage}배 이상</div>`;
  return {d: nd, html: `<div class="react-grid">${html}</div>${note}`};
}

function renderTablePage(view, p, d){
  let reactHTML = "";
  if (p.reaction){ const r = addReaction(d, p.reaction); d = r.d; reactHTML = r.html; }
  const hide = new Set(p.hide || []);
  const idx = d.headers.map((h,i) => i).filter(i => !hide.has(d.headers[i]));
  const badgeCols = new Set((p.badges || []).map(h => d.headers.indexOf(h)));
  const filterCols = (p.filters || []).map(h => d.headers.indexOf(h)).filter(i => i >= 0);
  const isNumCol = i => { const v = d.data.map(r => r[i]).filter(Boolean); return v.length > 0 && v.every(x => num(x) !== null) && !/^No\.?$/.test(d.headers[i]); };
  const isDateCol = i => { const v = d.data.map(r => r[i]).filter(Boolean); return v.length > 0 && v.every(x => parseDate(x)); };
  const numCols = new Set(idx.filter(isNumCol)), dateCols = new Set(idx.filter(isDateCol));
  const st = {q:"", f:{}, sort: p.sort ? d.headers.indexOf(p.sort.col) : -1, dir: p.sort?.dir || 1};

  // 요약 타일: 건수 + 숫자 열 합계 + 첫 필터 상위값
  const tiles = [["전체", d.data.length + "건"]];
  idx.filter(i => numCols.has(i) && /(조회|좋아요|댓글|단가|금액|수익|매출|비용)/.test(d.headers[i]) && !/배수/.test(d.headers[i])).forEach(i =>
    tiles.push([d.headers[i] + " 합계", compact(d.data.reduce((a,r) => a + (num(r[i])||0), 0))]));
  if (filterCols[0] !== undefined){
    const c = {}; d.data.forEach(r => { const v = r[filterCols[0]]; if (v) c[norm(v)] = [(c[norm(v)]?.[0]||0)+1, v]; });
    Object.values(c).sort((a,b)=>b[0]-a[0]).slice(0, 3).forEach(([n,v]) => tiles.push([v, n + "건"]));
  }

  const opts = i => {
    const c = {}; d.data.forEach(r => { const v = r[i]; if (v) c[norm(v)] = [(c[norm(v)]?.[0]||0)+1, c[norm(v)]?.[1] || v]; });
    return Object.entries(c).sort((a,b) => b[1][0]-a[1][0]);
  };
  view.innerHTML = `
    <h2 class="page-title">${esc(p.label)}</h2>
    <p class="page-sub">${esc(d.title)}</p>
    <div class="tiles">${tiles.map(([k,v]) => `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("")}</div>
    ${reactHTML}
    <section class="panel" style="padding:12px">
      <div class="toolbar">
        <input type="search" id="q" placeholder="검색 (브랜드, 제목, 담당자 등)">
        ${filterCols.map(i => { const o = opts(i); return o.length ? `<select data-f="${i}" aria-label="${esc(d.headers[i])}">
          <option value="">${esc(d.headers[i])}: 전체</option>${o.map(([k,[n,v]]) => `<option value="${esc(k)}">${esc(v)} (${n})</option>`).join("")}</select>` : ""; }).join("")}
        <span class="count" id="count"></span>
      </div>
      <div class="tbl-wrap"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
    </section>`;

  const cell = (v, i) => {
    if (!v) return "";
    if (/^(TRUE|FALSE)$/i.test(v)) return `<span class="chk ${/TRUE/i.test(v)?"on":""}">${/TRUE/i.test(v)?"☑":"☐"}</span>`;
    if (badgeCols.has(i)) return `<span class="badge">${esc(v)}</span>`;
    if (/^https?:\/\/\S+$/.test(v)) return `<a href="${esc(v)}" target="_blank" rel="noopener">열기 ↗</a>`;
    if (v === "바로가기") return `<span class="muted" title="CSV로 내보내면 시트의 하이퍼링크가 사라집니다. URL 원문을 넣어주세요.">—</span>`;
    const em = v.match(/^\s*"?([^"<]*?)"?\s*<([^>\s]+@[^>\s]+)>\s*$/);
    if (em) return `${esc(em[1].trim() || em[2])}<br><a href="mailto:${esc(em[2])}" class="muted" style="font-size:12px">${esc(em[2])}</a>`;
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return `<a href="mailto:${esc(v)}">${esc(v)}</a>`;
    return esc(v).replace(/\n/g, "<br>");
  };

  const draw = () => {
    let rows = d.data.slice();
    if (st.q) rows = rows.filter(r => r.some(c => c.toLowerCase().includes(st.q)));
    Object.entries(st.f).forEach(([i,v]) => { if (v) rows = rows.filter(r => norm(r[i]) === v); });
    if (st.sort >= 0){
      const i = st.sort;
      rows.sort((a,b) => {
        const A = a[i], B = b[i];
        if (!A && !B) return 0; if (!A) return 1; if (!B) return -1;     // 빈 칸은 항상 아래
        const da = parseDate(A), db = parseDate(B);
        if (da && db) return (da - db) * st.dir;
        const na = num(A), nb = num(B);
        if (na !== null && nb !== null) return (na - nb) * st.dir;
        return A.localeCompare(B, "ko") * st.dir;
      });
    }
    $("#th").innerHTML = "<tr>" + idx.map(i =>
      `<th data-i="${i}" class="${numCols.has(i)?"num":""}">${esc((p.rename || {})[d.headers[i]] || d.headers[i])}<span class="ar">${i===st.sort?(st.dir>0?"▲":"▼"):""}</span></th>`).join("") + "</tr>";
    $("#tb").innerHTML = rows.length ? rows.map(r => "<tr>" + idx.map(i =>
      `<td class="${numCols.has(i)?"num":""} ${dateCols.has(i)?"nowrap":""}">${cell(r[i], i)}</td>`).join("") + "</tr>").join("")
      : d.data.length ? `<tr><td colspan="${idx.length}" class="msg">조건에 맞는 항목이 없습니다</td></tr>`
      : `<tr>${idx.map(i => `<td class="muted ${numCols.has(i) ? "num" : ""}">-</td>`).join("")}</tr>`;
    $("#count").textContent = `${rows.length} / ${d.data.length}건`;
    view.querySelectorAll("th[data-i]").forEach(th => th.onclick = () => {
      const i = +th.dataset.i;
      if (st.sort === i) st.dir *= -1; else { st.sort = i; st.dir = 1; }
      draw();
    });
  };
  $("#q").oninput = e => { st.q = e.target.value.toLowerCase(); draw(); };
  view.querySelectorAll("select[data-f]").forEach(s => s.onchange = () => { st.f[s.dataset.f] = s.value; draw(); });
  draw();
}

/* ======================= 라우팅 ======================= */
function currentPage(){
  const id = location.hash.slice(1);
  return CONFIG.pages.find(p => p.id === id && p.tab !== false) || CONFIG.pages[0];
}
function render(){
  const page = currentPage();
  $("#tabs").innerHTML = CONFIG.pages.filter(p => p.tab !== false).map(p =>
    `<a href="#${p.id}" class="${p.id===page.id?"active":""}">${esc(p.label)}</a>`).join("");
  document.title = `${page.label} · ${CONFIG.title}`;
  const view = $("#view");
  if (page.type === "home") return renderHome(view);
  const d = store[page.id];
  if (page.type === "ideas" && d && d.kind === "ideas") renderIdeasPage(view, page, d);
  else if (!d || d.kind === "error") view.innerHTML = `<div class="msg">⚠️ 데이터를 읽지 못했습니다: ${esc(d?.message || "알 수 없는 오류")}</div>`;
  else if (d.kind === "empty") view.innerHTML = `<div class="msg"><code>${esc(page.file)}</code> 파일이 비어 있습니다.</div>`;
  else if (page.type === "revenue" && d.kind === "table") renderRevenuePage(view, page, d);
  else if (d.kind === "calendar") renderCalendarPage(view, page, d);
  else if (d.kind === "metrics") renderMetricsPage(view, page, d);
  else renderTablePage(view, page, d);
  window.scrollTo(0, 0);
}

window.addEventListener("error", e => {
  const v = document.getElementById("view");
  if (v) v.insertAdjacentHTML("afterbegin", `<div class="notice" style="color:#d14b4a">⚠️ 화면을 그리는 중 오류가 났습니다: ${esc(e.message)}</div>`);
});
async function start(){
  $("#lock").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#title").textContent = CONFIG.title;
  $("#subtitle").textContent = CONFIG.subtitle;
  const SNS = {
    instagram: {name:"Instagram", color:"#C2255C"}, youtube: {name:"YouTube", color:"#E03131"},
    tiktok: {name:"TikTok", color:"var(--text)"}, blog: {name:"Blog", color:"#2B8A3E"}, link: {name:"Link", color:"var(--muted)"}
  };
  $("#sns").innerHTML = (CONFIG.links || []).filter(l => /^https?:\/\//.test(l.url || "")).map(l => {
    const t = SNS[l.type] || SNS.link, name = l.label || t.name;
    return `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer"><i class="dot" style="background:${t.color}"></i>${esc(name)}<span class="arr">↗</span></a>`;
  }).join("");
  if (BUNDLE && BUNDLE.live) $("#upd").textContent = "시트 불러오는 중…";
  await loadLive();
  await Promise.all(CONFIG.pages.filter(p => p.file).map(loadPage));
  const fmtUpd = d => d.toLocaleString("ko-KR", {month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit"});
  if (LIVE && LIVE.ok.length){
    $("#upd").textContent = `시트 실시간 · ${fmtUpd(LIVE.at)} 기준` + (LIVE.fail.length ? " (일부는 저장본)" : "");
    if (LIVE.fail.length) $("#upd").title = "불러오지 못해 저장된 데이터로 보여주는 시트: " + LIVE.fail.join(", ");
  }
  else if (latestMod) $("#upd").textContent = (LIVE ? "저장된 데이터 · " : "데이터 업데이트 ") + fmtUpd(latestMod);
  render();
  window.addEventListener("hashchange", render);
}

// 저장 칸을 대시보드마다 따로 씀 (같은 github.io 주소에 있는 다른 대시보드 비밀번호와 섞이지 않게)
const PW_KEY = "dash-pw:" + location.pathname.replace(/index\.html$/, "");
let unlocking = null, unlocked = false;
async function tryUnlock(pw, remember){
  if (unlocked) return "";
  while (unlocking) await unlocking;          // 다른 시도가 진행 중이면 끝날 때까지 기다림
  if (unlocked) return "";
  let release; unlocking = new Promise(r => release = r);
  try {
    try { BUNDLE = await decryptBundle(pw); }
    catch(e){ return e.message === "NOFILE" ? "데이터를 찾을 수 없습니다" : "비밀번호가 올바르지 않습니다"; }
    unlocked = true;
    try { remember ? sessionStorage.setItem(PW_KEY, pw) : sessionStorage.removeItem(PW_KEY); } catch {}
    await start();
    return "";
  } finally { unlocking = null; release(); }
}

(function initLock(){
  $("#lockTitle").textContent = CONFIG.title;
  try { sessionStorage.removeItem("dash-pw"); } catch {}   // 예전 버전의 공용 저장값 정리

  // 1) 비밀번호 폼은 페이지가 열리자마자 연결 → 자동 입력 스크립트가 바로 제출해도 새로고침되지 않음
  $("#lockForm").addEventListener("submit", async e => {
    e.preventDefault();
    if (unlocked) return;
    const btn = $("#unlockBtn"); btn.disabled = true; $("#lockErr").textContent = "";
    const err = await tryUnlock($("#pw").value, $("#remember").checked);
    btn.disabled = false;
    if (err && !unlocked){ $("#lockErr").textContent = err; $("#pw").select(); }
  });

  // 2) 주소 끝의 #auto=비밀번호 로 바로 열기 (읽은 뒤 주소에서 지움)
  let auto = null;
  const m = location.hash.match(/[#&]auto=([^&]+)/);
  if (m){ try { auto = decodeURIComponent(m[1]); } catch { auto = m[1]; } history.replaceState(null, "", location.pathname + location.search); }

  // 3) 이 대시보드에 저장된 비밀번호
  let saved = null;
  try { saved = sessionStorage.getItem(PW_KEY); } catch {}

  (async () => {
    for (const pw of [auto, saved].filter(Boolean)) if (await tryUnlock(pw, true) === "") return;
    if (auto && !unlocked) $("#lockErr").textContent = "링크에 들어 있는 비밀번호가 맞지 않아요. 비밀번호를 직접 입력해 주세요.";
    if (saved && !unlocked) try { sessionStorage.removeItem(PW_KEY); } catch {}
    if (!unlocked) $("#pw").focus();
  })();
})();

$("#logoutBtn").onclick = () => {
  try { sessionStorage.removeItem(PW_KEY); } catch {}
  location.reload();
};

// 테마 전환 (이 브라우저에만 기억)
(function(){
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  $("#themeBtn").onclick = () => {
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("theme", next); } catch {}
  };
})();
</script>

@media (min-width:1280px){body.mm-on.mm-open #app{margin-right:380px} body.mm-open #mm-aside{box-shadow:none}}
@media (prefers-reduced-motion:reduce){#mm-aside{transition:none}}
</style>
<script>
(function () {
  "use strict";
  var cfg = null, memos = null, loadErr = "", busy = false, ROLE = "creator";
  var DOW = ["일", "월", "화", "수", "목", "금", "토"];
  var ERR = {
    unauthorized: "메모장 접근 키가 맞지 않아요. Apps Script를 '새 버전'으로 배포했는지 확인해 주세요.",
    bad_board: "메모장 설정이 올바르지 않아요.",
    bad_action: "Apps Script가 예전 버전이에요. 새 Code.gs로 바꾸고 '새 버전'으로 배포해 주세요.",
    empty_text: "내용을 입력해 주세요.",
    not_found: "이미 삭제된 메모예요."
  };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function el(id) { return document.getElementById(id); }
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function wide() { return window.matchMedia("(min-width:1280px)").matches; }
  function parseAt(s) { var m = /^(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})/.exec(s || ""); return m ? new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5]) : null; }
  function hm(d) { return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
  function roleName(r) { return r === "manager" ? cfg.manager : cfg.creator; }

  // 대시보드 잠금이 풀리면(복호화된 데이터에 메모장 설정이 있으면) 시작
  var wait = setInterval(function () {
    var app = el("app"), b = (typeof BUNDLE !== "undefined") ? BUNDLE : null;
    if (!app || app.classList.contains("hidden") || !b) return;
    clearInterval(wait);
    var m = b.memo || {};
    if (!m.url || !/^https:\/\/script\.google\.com\//.test(m.url) || !m.token || !m.board) return;   // 주소가 비어 있으면 표시하지 않음
    cfg = { url: m.url, token: m.token, board: m.board, creator: m.creator || "크리에이터", manager: m.manager || "소셜링 매니저" };
    build();
  }, 300);

  function build() {
    var c = esc(cfg.creator);
    var wrap = document.createElement("div");
    wrap.innerHTML =
      '<button type="button" id="mm-toggle" aria-controls="mm-aside" aria-expanded="false">💬 메모장<span class="mm-badge" id="mm-unread" hidden></span></button>' +
      '<aside id="mm-aside" aria-label="메모장">' +
        '<div class="mm-head"><div><h3>메모장</h3><p class="mm-note" id="mm-count"></p></div>' +
          '<button type="button" class="mm-x" id="mm-close" aria-label="메모장 닫기">×</button></div>' +
        '<div class="mm-pins" id="mm-pins" hidden></div>' +
        '<div class="mm-board" id="mm-list" aria-live="polite"><p class="mm-empty">메모 불러오는 중…</p></div>' +
        '<form class="mm-form" id="mm-form" autocomplete="off">' +
          '<div class="mm-row"><div class="mm-who" role="group" aria-label="보내는 사람"><span class="mm-note">보내는 사람</span>' +
            '<button type="button" class="mm-chip" data-role="creator" aria-pressed="true">' + c + '</button>' +
            '<button type="button" class="mm-chip" data-role="manager" aria-pressed="false">' + esc(cfg.manager) + '</button></div>' +
            '<label class="mm-pinopt" id="mm-pinopt" hidden><input type="checkbox" id="mm-pin"> 공지로 고정</label></div>' +
          '<label for="mm-text" class="mm-sr">메모 내용</label>' +
          '<textarea id="mm-text" maxlength="2000" placeholder="메모를 입력하세요 (Ctrl + Enter로 보내기)"></textarea>' +
          '<div class="mm-row"><span class="mm-status" id="mm-status" role="status"></span><button class="mm-send" type="submit" id="mm-send">보내기</button></div>' +
        '</form>' +
      '</aside>';
    while (wrap.firstChild) document.body.appendChild(wrap.firstChild);
    document.body.classList.add("mm-on");

    el("mm-toggle").addEventListener("click", function () { setOpen(true); });
    el("mm-close").addEventListener("click", function () { setOpen(false); el("mm-toggle").focus(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && document.body.classList.contains("mm-open") && !wide()) setOpen(false); });
    el("mm-text").addEventListener("keydown", function (e) { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); } });
    el("mm-form").addEventListener("submit", function (e) { e.preventDefault(); send(); });
    el("mm-list").addEventListener("click", onListClick);
    var chips = document.querySelectorAll("#mm-aside [data-role]");
    for (var i = 0; i < chips.length; i++) chips[i].addEventListener("click", function () { setRole(this.getAttribute("data-role")); });

    setRole(ls("memo-role") === "manager" ? "manager" : "creator", true);
    var saved = ls("memo-open:" + cfg.board);
    setOpen(saved === null ? wide() : saved === "1" && wide(), false);   // 넓은 화면은 기본으로 열림, 좁은 화면은 버튼으로 열기
    load();
    setInterval(function () { if (document.visibilityState === "visible") load(); }, 60000);
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") load(); });
  }

  function setOpen(open, remember) {
    document.body.classList.toggle("mm-open", open);
    el("mm-toggle").setAttribute("aria-expanded", open);
    if (remember !== false) ls("memo-open:" + cfg.board, open ? "1" : "0");
    if (open) { var l = el("mm-list"); l.scrollTop = l.scrollHeight; if (!wide()) setTimeout(function () { el("mm-text").focus(); }, 60); }
  }
  function setRole(r, silent) {
    ROLE = r; ls("memo-role", r);
    var chips = document.querySelectorAll("#mm-aside [data-role]");
    for (var i = 0; i < chips.length; i++) chips[i].setAttribute("aria-pressed", chips[i].getAttribute("data-role") === r);
    el("mm-pinopt").hidden = r !== "manager";
    if (!silent) render(true);
  }
  function status(t, ok) { var s = el("mm-status"); s.className = "mm-status " + (t ? (ok ? "ok" : "bad") : ""); s.textContent = t || ""; }

  function api(body) {
    var payload = { token: cfg.token, board: cfg.board };
    for (var k in body) payload[k] = body[k];
    return fetch(cfg.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload), redirect: "follow" })
      .then(function (r) { return r.json(); }, function () { throw new Error("network"); })
      .then(function (j) { if (!j || !j.ok) throw new Error((j && j.error) || "unknown"); return j.memos || []; });
  }
  function errText(e) {
    var k = e && e.message;
    if (ERR[k]) return ERR[k];
    if (k === "network") return "메모장 서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.";
    return "처리하지 못했어요. (" + k + ")";
  }

  function load() {
    if (busy) return;
    api({ action: "list" }).then(function (list) {
      var changed = !memos || JSON.stringify(memos) !== JSON.stringify(list);
      memos = list; loadErr = "";
      if (changed && !el("mm-list").querySelector("[data-del-yes]")) render(false);
    }, function (e) { loadErr = errText(e); if (!memos) render(false); });
  }
  function act(body, okText, btn) {
    busy = true; if (btn) btn.disabled = true;
    return api(body).then(function (list) { memos = list; loadErr = ""; if (okText) status(okText, true); else status(""); render(true); return true; },
      function (e) { status("저장하지 못했어요. " + errText(e), false); if (btn) btn.disabled = false; return false; })
      .then(function (ok) { busy = false; return ok; });
  }
  function send() {
    var text = el("mm-text").value.trim(), btn = el("mm-send");
    if (busy || btn.disabled) return;
    if (!text) { status("내용을 입력해 주세요.", false); el("mm-text").focus(); return; }
    btn.disabled = true; btn.textContent = "보내는 중…"; status("");
    act({ action: "add", role: ROLE, author: roleName(ROLE), text: text, pin: ROLE === "manager" && el("mm-pin").checked }, "저장했어요.").then(function (ok) {
      if (ok) { el("mm-text").value = ""; el("mm-pin").checked = false; }
      btn.disabled = false; btn.textContent = "보내기";
    });
  }

  function onListClick(e) {
    var b = e.target.closest("button");
    if (!b || busy) return;
    if (b.hasAttribute("data-check")) act({ action: "check", id: b.getAttribute("data-check"), by: roleName(ROLE) }, "", b);
    else if (b.hasAttribute("data-pin")) act({ action: b.getAttribute("data-on") === "1" ? "pin" : "unpin", id: b.getAttribute("data-pin") }, "", b);
    else if (b.hasAttribute("data-del")) {
      b.parentNode.innerHTML = '<span class="mm-note" style="margin:0">이 메모를 삭제할까요?</span>' +
        '<button type="button" class="mm-link del" data-del-yes="' + esc(b.getAttribute("data-del")) + '">삭제</button>' +
        '<button type="button" class="mm-link" data-cancel>취소</button>';
    }
    else if (b.hasAttribute("data-del-yes")) act({ action: "delete", id: b.getAttribute("data-del-yes") }, "삭제했어요.", b);
    else if (b.hasAttribute("data-cancel")) render(false);
  }

  function render(toBottom) {
    var list = el("mm-list");
    var nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 60;
    if (!memos) {
      list.innerHTML = '<p class="mm-empty">' + (loadErr ? "메모를 불러오지 못했어요. " + esc(loadErr) : "메모 불러오는 중…") + '</p>';
      el("mm-count").textContent = esc(cfg.creator) ? cfg.creator + "님과 소셜링이 주고받는 메모" : "";
      return;
    }
    var waitFor = function (r) { return memos.filter(function (m) { return m.role !== r && !m.checkedAt; }).length; };
    el("mm-count").textContent = memos.length
      ? cfg.creator + " 확인 대기 " + waitFor("creator") + "건 · 매니저 확인 대기 " + waitFor("manager") + "건"
      : cfg.creator + "님과 소셜링이 주고받는 메모";
    var unread = waitFor(ROLE), ub = el("mm-unread"); ub.hidden = !unread; ub.textContent = unread > 99 ? "99+" : unread;

    var pins = memos.filter(function (m) { return m.pin; }).slice(-3).reverse(), pb = el("mm-pins");
    pb.hidden = !pins.length;
    pb.innerHTML = pins.map(function (m) { return '<div><b>📌 공지</b>' + esc(m.text) + '</div>'; }).join("");

    var lastDay = "", html = "";
    memos.forEach(function (m) {
      var d = parseAt(m.at), day = d ? d.getFullYear() + "." + (d.getMonth() + 1) + "." + d.getDate() + " (" + DOW[d.getDay()] + ")" : "";
      if (day && day !== lastDay) { html += '<div class="mm-day">' + day + '</div>'; lastDay = day; }
      var mine = m.role === ROLE, other = m.role === "manager" ? cfg.creator : "매니저";
      var cd = parseAt(m.checkedAt);
      var st = m.checkedAt
        ? '<span class="mm-pill yes">✓ ' + esc(m.checkedBy || other) + ' 확인 ' + (cd ? hm(cd) : "") + '</span>'
        : '<span class="mm-pill wip">' + esc(other) + ' 확인 대기</span>';
      html += '<div class="mm-msg ' + m.role + '">' +
        '<div class="mm-meta"><b>' + esc(m.author) + '</b><span>' + (d ? hm(d) : esc(m.at)) + '</span>' + (m.pin ? '<span class="mm-pill">📌 공지</span>' : "") + '</div>' +
        '<div class="mm-bub">' + esc(m.text) + '</div>' +
        '<div class="mm-acts">' + st +
          (!mine && !m.checkedAt ? '<button type="button" class="mm-link" data-check="' + esc(m.id) + '">확인했어요</button>' : "") +
          (ROLE === "manager" && m.role === "manager" ? '<button type="button" class="mm-link" data-pin="' + esc(m.id) + '" data-on="' + (m.pin ? "0" : "1") + '">' + (m.pin ? "공지 해제" : "공지로 고정") + '</button>' : "") +
          (mine ? '<button type="button" class="mm-link del" data-del="' + esc(m.id) + '">삭제</button>' : "") +
        '</div></div>';
    });
    list.innerHTML = html || '<p class="mm-empty">아직 메모가 없어요. 첫 메모를 남겨 보세요.</p>';
    if (toBottom || nearBottom) list.scrollTop = list.scrollHeight;
  }
})();
</script>
<!-- ===== 공유 메모장 위젯 끝 ===== -->
<script>
(function () {
  var m = location.hash.match(/[#&]auto=([^&]+)/);
  if (!m) return;
  var pw = decodeURIComponent(m[1]);
  history.replaceState(null, "", location.pathname + location.search);
  function tryUnlock(n) {
    var input = document.querySelector('input[type="password"]');
    if (!input) { if (n < 50) setTimeout(function () { tryUnlock(n + 1); }, 100); return; }
    input.value = pw;
    input.dispatchEvent(new Event("input", { bubbles: true }));
    var btn = [].slice.call(document.querySelectorAll('button, input[type="submit"]'))
      .filter(function (b) { return /입장/.test(b.textContent || b.value || ""); })[0];
    if (btn) btn.click();
    else if (input.form) { input.form.requestSubmit ? input.form.requestSubmit() : input.form.submit(); }
    else input.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { tryUnlock(0); });
  else tryUnlock(0);
})();
</script>
